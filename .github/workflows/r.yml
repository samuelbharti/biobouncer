name: R-CMD-check

on:
  push:
    branches: [main]
    paths: ["pkg-r/**", "shared/**", ".github/workflows/r.yml"]
  pull_request:
    paths: ["pkg-r/**", "shared/**", ".github/workflows/r.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: R-CMD-check (${{ matrix.config.os }}, ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      # CRAN checks against r-devel, r-release, and r-oldrel, so the matrix
      # covers all three. devel and oldrel run on ubuntu; the other platforms
      # cover release, which is what most users are on.
      matrix:
        config:
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: windows-latest, r: "release" }
          - { os: macos-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: pkg-r

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r
          upload-snapshots: true

  lint-r:
    runs-on: ubuntu-latest
    name: lint-r
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
          working-directory: pkg-r

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        working-directory: pkg-r
        env:
          LINTR_ERROR_ON_LINT: true
